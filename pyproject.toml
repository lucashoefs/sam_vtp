[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sam-vtp"
version = "0.2.0"
description = "Temporally consistent continuous traversability prediction from video"
readme = "README.md"
license = { file = "LICENSE" }
# 3.10 is SAM 2's floor, inherited through the submodule.
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.21", "Pillow>=9.0", "hydra-core>=1.3", "omegaconf>=2.3"]

[project.optional-dependencies]
labels = ["opencv-python>=4.5"]

[project.scripts]
sam-vtp-infer = "sam_vtp.cli:main"
sam-vtp-smoke = "sam_vtp.smoke:main"
sam-vtp-labels = "sam_vtp.labels.generate:main"

[tool.setuptools.packages.find]
where = ["src"]

# build_config() loads the delta YAML at runtime via importlib.resources, so it
# has to ship inside the package. Without this a non-editable install imports
# fine and then fails on the first build_model().
[tool.setuptools.package-data]
"sam_vtp" = ["configs/*.yaml"]
