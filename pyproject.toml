[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sam-vtp"
version = "0.2.0"
description = "Temporally consistent continuous traversability prediction from video"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"

# The network is defined in-tree and needs nothing but torch. numpy and Pillow
# are for image I/O in the inference helpers, not for the model.
dependencies = [
  "torch>=2.0",
  "numpy>=1.21",
  "Pillow>=9.0",
]

[project.optional-dependencies]
# Only the label pipeline needs OpenCV.
labels = ["opencv-python>=4.5"]

[project.scripts]
sam-vtp-infer = "sam_vtp_core.cli:main"
sam-vtp-smoke = "sam_vtp_core.smoke:main"
sam-vtp-labels = "sam_vtp_core.labels.generate:main"

[tool.setuptools.packages.find]
where = ["src"]
